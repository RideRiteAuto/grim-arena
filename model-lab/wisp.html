<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Model lab: wisp</title>
<style>body{margin:0;background:#0e1420}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
// WISP rig. Ice sprites, will-o-wisps and dust devils all ride this.
//
// A wisp has no skeleton, so the whole rig is a core, a shell that breathes,
// a ring of motes on their own orbits, and a light. That means everything it
// does has to be sold by brightness, scale and drift, which is why the pose
// function below moves the light as hard as it moves the geometry.
import { T, makeScene, loft, jitterGeo, runLab } from './lab.js';

const ctx = makeScene({ sky: 0x0e1420, ground: 0x2a3040 });

function buildWisp(tint) {
  tint = tint || 0x8fe3ff;
  const root = new T.Group();
  const body = new T.Group(); body.position.y = 1.05; root.add(body);

  // core: small, bright, and the only part that is fully opaque
  const core = new T.Mesh(new T.IcosahedronGeometry(0.13, 1),
    new T.MeshBasicMaterial({ color: 0xffffff }));
  body.add(core);

  // shell: the visible body of the thing, translucent and additive so two
  // wisps overlapping read as brighter rather than as a hard edge
  const shellGeo = jitterGeo(new T.IcosahedronGeometry(0.34, 1), 0.18, 21, 1);
  const shell = new T.Mesh(shellGeo, new T.MeshBasicMaterial({
    color: tint, transparent: true, opacity: 0.45, blending: T.AdditiveBlending, depthWrite: false
  }));
  body.add(shell);

  // halo: a second, much softer shell that carries the size changes
  const halo = new T.Mesh(new T.IcosahedronGeometry(0.62, 1), new T.MeshBasicMaterial({
    color: tint, transparent: true, opacity: 0.14, blending: T.AdditiveBlending, depthWrite: false
  }));
  body.add(halo);

  // trailing wisps of vapour, each on its own orbit and phase
  const motes = [];
  for (let i = 0; i < 6; i++) {
    const m = new T.Mesh(new T.IcosahedronGeometry(0.05 + (i % 3) * 0.018, 0),
      new T.MeshBasicMaterial({ color: tint, transparent: true, opacity: 0.7, blending: T.AdditiveBlending, depthWrite: false }));
    m.userData = { r: 0.42 + (i % 3) * 0.14, sp: 0.7 + i * 0.19, ph: i * 1.05, tilt: (i - 2.5) * 0.22 };
    body.add(m); motes.push(m);
  }

  // the light is part of the character, not decoration: it is what makes a
  // wisp readable across a dark fen
  const light = new T.PointLight(tint, 3.2, 9, 2);
  body.add(light);

  return { g: root, body, core, shell, halo, motes, light, tint: new T.Color(tint) };
}

// idle: hangs and breathes. move: leans into its drift and stretches.
// attack: winds down small and dark, then blows out into a nova. The wind
// down matters as much as the flash, because it is the only telegraph a
// shapeless thing can give you.
function poseWisp(w, state, t) {
  const B = w.body;
  let bright = 1, size = 1, lean = 0;
  if (state === 'idle') {
    B.position.y = 1.05 + Math.sin(t * 1.3) * 0.07;
    B.position.x = Math.sin(t * 0.7) * 0.05;
    bright = 0.85 + Math.sin(t * 2.1) * 0.15;
    size = 1 + Math.sin(t * 2.1) * 0.06;
  } else if (state === 'move') {
    B.position.y = 1.05 + Math.sin(t * 3.1) * 0.12;
    B.position.x = Math.sin(t * 1.1) * 0.35;
    lean = Math.cos(t * 1.1) * 0.35;
    bright = 1.0 + Math.sin(t * 3.4) * 0.12;
    size = 1.05;
  } else if (state === 'attack') {
    // one and a half seconds: 0 to .55 gather, .55 to .75 hold, then burst
    const p = (t % 1.5) / 1.5;
    if (p < 0.55) { const k = p / 0.55; size = 1 - 0.45 * k; bright = 1 - 0.7 * k; B.position.y = 1.05 - 0.18 * k; }
    else if (p < 0.72) { size = 0.55; bright = 0.3; B.position.y = 0.87; }
    else { const k = (p - 0.72) / 0.28; size = 0.55 + 3.4 * k; bright = 0.3 + 3.2 * (1 - k) * k * 4; B.position.y = 0.87 + 0.5 * k; }
  }
  w.shell.scale.setScalar(size);
  w.halo.scale.setScalar(size * (state === 'attack' ? 1.1 : 1));
  w.core.scale.setScalar(0.8 + bright * 0.35);
  w.shell.material.opacity = Math.min(0.9, 0.45 * bright);
  w.halo.material.opacity = Math.min(0.6, 0.14 * bright * (state === 'attack' ? 2.2 : 1));
  w.light.intensity = 3.2 * bright;
  w.light.distance = 9 * Math.max(0.4, size);
  B.rotation.z = -lean * 0.5;

  w.motes.forEach((m, i) => {
    const d = m.userData;
    const a = t * d.sp + d.ph;
    const r = d.r * size * (state === 'move' ? 1.25 : 1);
    m.position.set(Math.cos(a) * r, Math.sin(a * 0.8) * 0.22 + d.tilt * 0.1, Math.sin(a) * r * (1 - Math.abs(lean) * 0.3));
    m.material.opacity = Math.min(1, 0.7 * bright);
    m.scale.setScalar(state === 'attack' ? Math.max(0.2, size * 0.8) : 1);
  });
}

runLab(ctx, buildWisp(), poseWisp, { name: 'WISP' });
</script>
</body>
</html>
