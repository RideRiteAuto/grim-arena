<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Model lab: CHARACTER</title>
<style>
  body { margin:0; background:#12140f; }
  #lbl { position:fixed; left:12px; top:12px; font:600 13px system-ui,sans-serif; color:#F3DC00; letter-spacing:.08em; }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<div id="lbl">CHARACTER</div>
<script type="module">
// Prop lab template. Copy to model-lab/<thing>.html, replace CHARACTER throughout,
// and adjust the cameras to suit the object's size.
//
// A prop is not a rig, so this page is not a state turntable. What it has to
// answer instead is: does it read as the thing, from the distances and angles a
// player actually sees it from, in the light the game is actually lit in. So
// the shot hook takes a named CAMERA rather than a named state, and the
// lighting flips between the game's dusk, flat noon and night, because a thing
// that only looks good in the dark looks wrong all day.
//
// Two pieces here are load-bearing and should survive any edit:
//   - the render loop is CANCELLED on the first __shot call. Without that the
//     loop draws over the harness's camera and every named view comes back
//     looking like the same 3/4 angle, plausibly enough that you do not notice.
//   - the 1.8 m human on the `scale` camera. Nothing else calibrates size.
import * as T from 'three';
import { makeFighterModel } from './character.js';

const W = 960, H = 660;
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const cam = new T.PerspectiveCamera(42, W / H, 0.05, 200);

// Two lighting rigs. DUSK is the game's own look; DAY is the honest test,
// because additive fire has nothing to hide behind in flat light.
const LIGHTS = {
  dusk: { sky: 0x141a17, hemi: [0x3d4a58, 0x241f16, 0.55], sun: [0xffb779, 0.55, [6, 9, 4]], ground: 0x33402b, fog: [16, 62] },
  day:  { sky: 0x8fa9b8, hemi: [0xcdd9e8, 0x3a3628, 0.95], sun: [0xffeecc, 1.7, [6, 10, 4]], ground: 0x53603c, fog: [30, 120] },
  night:{ sky: 0x070a0d, hemi: [0x1b2430, 0x0b0d0a, 0.30], sun: [0x9fb6d8, 0.18, [-5, 8, -3]], ground: 0x1e2418, fog: [10, 46] }
};
let hemi, sun, ground;
function applyLights(name) {
  const L = LIGHTS[name] || LIGHTS.dusk;
  scene.background = new T.Color(L.sky);
  scene.fog = new T.Fog(L.sky, L.fog[0], L.fog[1]);
  hemi.color.setHex(L.hemi[0]); hemi.groundColor.setHex(L.hemi[1]); hemi.intensity = L.hemi[2];
  sun.color.setHex(L.sun[0]); sun.intensity = L.sun[1]; sun.position.set(...L.sun[2]);
  ground.material.color.setHex(L.ground);
  window.__light = name;
}

hemi = new T.HemisphereLight(0xffffff, 0x000000, 1); scene.add(hemi);
sun = new T.DirectionalLight(0xffffff, 1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0012;
scene.add(sun);

// A dirt disc with a little relief, so the ground glow has something to drape
// over and the fire is not sitting on a mirror.
const gGeo = new T.PlaneGeometry(60, 60, 60, 60);
gGeo.rotateX(-Math.PI / 2);
// Relief everywhere EXCEPT a flattened pad under the character. v4's feet
// were judged "cut off by the ground" and half of that was this page: the
// model stood at heightAt(0,0) while each foot stood on its own different
// height. A character is reviewed on flat ground, like a game spawn point.
const rawHeight = (x, z) => Math.sin(x * 0.28) * 0.055 + Math.sin(z * 0.21 + 1.1) * 0.045
  + Math.sin((x + z) * 0.62) * 0.018;
const heightAt = (x, z) => {
  const d = Math.hypot(x, z);
  const flat = Math.max(0, Math.min(1, (d - 0.55) / 0.9));   // 0 inside the pad
  return rawHeight(0, 0) * (1 - flat) + rawHeight(x, z) * flat;
};
{
  const p = gGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  gGeo.computeVertexNormals();
}
ground = new T.Mesh(gGeo, new T.MeshStandardMaterial({ color: 0x53603c, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// A 1.8 m human stand-in. Nothing calibrates a prop's size like putting a
// person next to it, and a campfire that is right for a torch is far too small
// for something people sit around.
const manM = new T.MeshStandardMaterial({ color: 0x3b4250, roughness: 0.9, flatShading: true });
const man = new T.Group();
{
  const legs = new T.Mesh(new T.CylinderGeometry(0.14, 0.17, 0.9, 8), manM); legs.position.y = 0.45;
  const torso = new T.Mesh(new T.CylinderGeometry(0.20, 0.24, 0.62, 8), manM); torso.position.y = 1.16;
  const head = new T.Mesh(new T.SphereGeometry(0.13, 10, 8), manM); head.position.y = 1.62;
  [legs, torso, head].forEach(m => { m.castShadow = true; man.add(m); });
  man.position.set(1.05, heightAt(1.05, 0.35), 0.35);
  man.visible = false;
  scene.add(man);
}

const model = makeFighterModel(T, { steel: 0x99a3b0, cloth: 0x6f8a3d, trim: 0xc9a15a });
model.g.position.y = heightAt(0, 0);
scene.add(model.g);
// lab controls: show armor state and weapon via __shot opts
const prop = { g: model.g, radius: 0.5 };
window.__prop = prop;
window.__model = model;
window.__scene = scene;
model.parts.sword.visible = true;
model.parts.shield.visible = true;
// The lab's stand-in for animate(), and the REFERENCE implementation the
// game patch ports. Poses:
//   shield  - sword+board idle: right arm hangs, left carries the shield
//             out at the side with the elbow near a right angle
//   staff   - staff idle
//   bow     - bow idle, carried in the left hand at the side
//   bowdraw - full draw: bow arm extended, string hand at the cheek
//   walk / run - the gait cycle, knees actually flexing
let POSE = 'shield';
function poseFighter(P, t, pose) {
  const brT = Math.sin(t * (Math.PI * 2 / 3.9));
  P.chest.scale.set(1 + 0.010 * brT, 1 + 0.006 * brT, 1 + 0.016 * brT);
  model.body.position.y = 0.012 * brT;
  model.body.rotation.z = 0.015 * Math.sin(t * (Math.PI * 2 / 7.3));
  P.upper.rotation.set(0, 0, -0.012 * Math.sin(t * (Math.PI * 2 / 7.3) + 0.5));
  P.head.rotation.y = 0.06 * Math.sin(t * (Math.PI * 2 / 11));
  // neutral base
  P.armR.rotation.set(0, 0, 0.04);
  P.armL.rotation.set(0, 0, -0.06);
  P.elbowR.rotation.set(-0.12, 0, 0);
  P.elbowL.rotation.set(-0.12, 0, 0);
  P.legR.rotation.set(0, 0, 0);
  P.legL.rotation.set(0, 0, 0);
  P.kneeR.rotation.set(0.06, 0, 0);
  P.kneeL.rotation.set(0.06, 0, 0);
  P.bow.visible = false; P.shield.visible = false; P.sword.visible = false;

  if (pose === 'shield') {
    P.sword.visible = true; P.shield.visible = true;
    // The carry, matched to Kevin's Dragonwilds reference shots: the arm
    // hangs with only a soft elbow bend, and the shield rides UPRIGHT and
    // LOW at the side (point down, face out, a slight lean). The right-angle
    // elbow of the first cut put the shield chest-high, which Kevin caught
    // against the references.
    P.armL.rotation.set(-0.05, 0, 0.20);
    P.elbowL.rotation.set(-0.30, 0, 0);
    P.shield.position.set(0.102, -0.351, -0.157);
    P.shield.rotation.set(-1.220, 0.207, 3.131);
  } else if (pose === 'staff') {
    P.staff.visible = true;
    P.armR.rotation.set(-0.06, 0, 0.08);
    P.elbowR.rotation.set(-0.42, 0, 0);
  } else if (pose === 'bow') {
    P.bow.visible = true;
    // Reference: the archer idles with the bow held across the FRONT at hip
    // height, roughly horizontal, string side toward the body. Hand comes in
    // front of the hip; the fist pitches the bow forward from vertical.
    P.armL.rotation.set(-0.50, 0, 0.06);
    P.elbowL.rotation.set(-0.30, 0, 0);
    // fixed fist euler, chosen against the reference: the bow lies in the
    // body's frontal plane, full curve showing, string toward the body
    P.handL.rotation.set(0.799, -0.029, 1.227);
    P.bowSet.setDraw(0);
  } else if (pose === 'bowrun') {
    P.bow.visible = true;
    // running with the bow: the arm joins the swing and the bow rides at
    // the side, still horizontal-ish in the fist (the reference's run frame)
    const phB = t * 9.0;
    const hipB = Math.sin(phB) * 0.70;
    P.legR.rotation.x = hipB; P.legL.rotation.x = -hipB;
    P.kneeR.rotation.x = 0.08 + 1.65 * Math.pow(Math.max(0, Math.sin(phB - 0.65)), 1.4);
    P.kneeL.rotation.x = 0.08 + 1.65 * Math.pow(Math.max(0, Math.sin(phB - 0.65 + Math.PI)), 1.4);
    P.upper.rotation.x = 0.20;
    P.armR.rotation.set(-hipB * 0.55, 0, 0.05);
    P.elbowR.rotation.set(-0.18 - Math.max(0, Math.sin(phB + Math.PI)) * 0.42, 0, 0);
    P.armL.rotation.set(hipB * 0.45, 0, -0.08);
    P.elbowL.rotation.set(-0.35, 0, 0);
    P.handL.rotation.set(1.72, 0.083, 0.017);   // string UP, bow fore-aft at the side
    P.bowSet.setDraw(0);
  } else if (pose === 'bowdraw') {
    P.bow.visible = true;
    P.bowSet.arrow.visible = true;
    // bow arm extended at the target, string hand drawn to the cheek
    P.armL.rotation.set(-1.50, 0, -0.04);
    P.elbowL.rotation.set(-0.08, 0, 0);
    P.handL.rotation.x = -(P.armL.rotation.x + P.elbowL.rotation.x);
    // The string arm comes from two-bone IK (harness/pose38-draw.js): the
    // fist lands ON the nocking point, keys solved at setDraw 0.15 and 0.9.
    // These are the FULL-draw eulers the game lerps to with the charge.
    P.armR.rotation.set(0.72, 0.159, 1.363);
    P.elbowR.rotation.set(-0.395, 0.393, 0.179);
    P.upper.rotation.y = 0.45;
    P.bowSet.setDraw(0.9);
    window.__drawPose = () => ({
      armR: [P.armR.rotation.x, P.armR.rotation.y, P.armR.rotation.z].map(v => +v.toFixed(3)),
      elbowR: [P.elbowR.rotation.x, P.elbowR.rotation.y, P.elbowR.rotation.z].map(v => +v.toFixed(3))
    });
  } else if (pose === 'block') {
    P.sword.visible = true; P.shield.visible = true;
    // guard: arm forward, shield face square to the front. The shield's
    // orientation is SOLVED in elbow space from the desired world frame
    // (face +Z, long axis vertical) and __blockPose() prints the eulers the
    // game patch bakes in.
    P.armL.rotation.set(-0.72, 0, -0.14);
    P.elbowL.rotation.set(-1.15, 0.15, 0);
    model.g.updateMatrixWorld(true);
    const qParent = new T.Quaternion();
    P.elbowL.getWorldQuaternion(qParent);
    // position solved from world targets too: shield centre sits a hand's
    // depth IN FRONT of the fist (the first cut had the fist poking through
    // the boss), a touch down so the guard covers chest to thigh
    {
      const fist = new T.Vector3();
      P.handL.getWorldPosition(fist);
      const target = fist.add(new T.Vector3(0.02, -0.10, 0.16)).sub(model.g.position);
      P.elbowL.worldToLocal(target.add(model.g.position));
      P.shield.position.copy(target);
    }
    // desired: shield local +X (face, after the y-flip) -> world +Z, local
    // +Y (top rim) -> world +Y
    const m = new T.Matrix4().makeBasis(
      new T.Vector3(0, 0, 1),      // local x -> world +z... face flipped below
      new T.Vector3(0, 1, 0),      // local y -> world up
      new T.Vector3(-1, 0, 0));
    const qWorld = new T.Quaternion().setFromRotationMatrix(m)
      .multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), Math.PI));
    P.shield.quaternion.copy(qParent).invert().multiply(qWorld);
    window.__blockPose = () => ({
      shield: [P.shield.rotation.x, P.shield.rotation.y, P.shield.rotation.z].map(v => +v.toFixed(3))
    });
  } else if (pose === 'walk' || pose === 'run') {
    P.sword.visible = true; P.shield.visible = true;
    const s = pose === 'run' ? 1 : 0.35;          // speed blend 0..1
    const ph = t * (4.6 + 4.4 * s);
    const hipA = 0.40 + 0.38 * s;
    const hip = Math.sin(ph) * hipA;
    P.legR.rotation.x = hip;
    P.legL.rotation.x = -hip;
    // knee flexion peaks during the swing phase, the leg is near straight
    // in stance - this is what makes it a stride instead of scissors
    const kMax = 0.85 + 0.85 * s;
    P.kneeR.rotation.x = 0.08 + kMax * Math.pow(Math.max(0, Math.sin(ph - 0.65)), 1.4);
    P.kneeL.rotation.x = 0.08 + kMax * Math.pow(Math.max(0, Math.sin(ph - 0.65 + Math.PI)), 1.4);
    model.body.position.y = Math.abs(Math.cos(ph)) * (0.025 + 0.045 * s);
    P.upper.rotation.x = 0.05 + 0.15 * s;
    // arms counter-swing with elbow follow-through; the shield arm keeps
    // its carry and just tightens with pace
    P.armR.rotation.set(-hip * 0.55, 0, 0.05);
    P.elbowR.rotation.set(-0.18 - Math.max(0, Math.sin(ph + Math.PI)) * 0.42 * (0.4 + 0.6 * s), 0, 0);
    P.armL.rotation.set(-0.05 + hip * 0.18, 0, 0.20);
    P.elbowL.rotation.set(-0.30, 0, 0);
    P.shield.position.set(0.102, -0.351, -0.157);
    P.shield.rotation.set(-1.220, 0.207, 3.131);
  }
}
const kit = { tick: (t) => { poseFighter(model.parts, t, POSE); } };

// Named cameras. Standing, seated, close, far and straight down: the five ways
// a player will ever look at a thing on the ground.
const VIEWS = {
  front:   { pos: [0, 1.45, 3.1], look: [0, 1.15, 0] },
  three4:  { pos: [1.9, 1.7, 2.4], look: [0, 1.1, 0] },
  profile: { pos: [3.1, 1.45, 0.15], look: [0, 1.15, 0] },
  back:    { pos: [0.2, 1.5, -3.1], look: [0, 1.15, 0] },
  face:    { pos: [0.25, 1.95, 1.05], look: [0, 1.86, 0] },
  hands:   { pos: [-0.85, 1.15, 0.95], look: [-0.33, 1.10, 0.03] },
  feet:    { pos: [0.7, 0.35, 1.5], look: [0, 0.18, 0] },
  // low grazing angle from behind-left: the view that exposed v4's
  // see-through shoulder and buried feet
  under:   { pos: [1.3, 0.55, -1.2], look: [0.25, 1.55, 0] },
  shieldside: { pos: [2.2, 1.15, 0.9], look: [0.32, 1.05, 0] },
  far:     { pos: [4.6, 2.6, 5.2], look: [0, 1.0, 0] },
  scale:   { pos: [2.6, 1.8, 3.0], look: [0.4, 1.1, 0.1] }
};

// The turntable keeps rendering after a shot is taken, so the screenshot ends
// up showing whatever the loop drew next rather than the camera that was
// asked for. Every named view came back looking like the same 3/4. The first
// __shot call kills the loop for good: from then on the page only ever draws
// what the harness asked it to draw.
let RAF = 0;
window.__shot = (view, t, light, opts) => {
  opts = opts || {};
  if (RAF) { cancelAnimationFrame(RAF); RAF = 0; }
  if (light) applyLights(light);
  man.visible = !!opts.man;
  if (opts.armor !== undefined) model.setArmor(!!opts.armor);
  if (opts.pose) POSE = opts.pose;
  kit.tick(t === undefined ? 3.0 : t);
  if (opts.weapons === false) { model.parts.sword.visible = false; model.parts.shield.visible = false; }
  const v = VIEWS[view] || VIEWS.front;
  cam.position.set(...v.pos);
  cam.lookAt(...v.look);
  renderer.render(scene, cam);
  return true;
};
// tweak-and-rerender hook for pose iteration: runs a snippet against the
// parts with the camera left where the last __shot put it, then re-renders
// WITHOUT re-posing - so a candidate value can be photographed directly.
window.__tweak = (src) => {
  (new Function('P', 'model', 'T', src))(model.parts, model, T);
  renderer.render(scene, cam);
  return true;
};
window.__views = Object.keys(VIEWS);
window.__stats = () => {
  let meshes = 0, tris = 0;
  prop.g.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    const p = o.geometry.attributes.position;
    tris += (o.geometry.index ? o.geometry.index.count : p.count) / 3;
  });
  renderer.render(scene, cam);
  return { meshes, tris, calls: renderer.info.render.calls, radius: prop.radius };
};
window.__ready = true;

applyLights('dusk');
const lbl = document.getElementById('lbl');
const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  kit.tick(t);
  const a = t * 0.28;
  cam.position.set(Math.sin(a) * 3.0, 1.6, Math.cos(a) * 3.0);
  cam.lookAt(0, 1.1, 0);
  lbl.textContent = 'CHARACTER  ' + (window.__light || 'dusk').toUpperCase();
  renderer.render(scene, cam);
  RAF = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
