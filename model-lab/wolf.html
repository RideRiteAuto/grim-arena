<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;background:#1a2030}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as T from 'three';

// ---------------------------------------------------------------- scene
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setSize(900, 620); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0x232a1c);
scene.fog = new T.Fog(0x232a1c, 18, 40);
const cam = new T.PerspectiveCamera(38, 900 / 620, 0.1, 100);
const hemi = new T.HemisphereLight(0xcdd9e8, 0x3a3628, 0.85); scene.add(hemi);
const sun = new T.DirectionalLight(0xffeecc, 1.5); sun.position.set(6, 10, 4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);
const ground = new T.Mesh(new T.CircleGeometry(20, 40), new T.MeshStandardMaterial({ color: 0x4a5236, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------------------------------------------------------------- fur texture
// subtle canvas fur: directional streaks, no repeating look
function furTexture(base, dark) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 128, 128);
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) {
    x.strokeStyle = 'rgba(' + dark + ',' + (0.05 + rnd() * 0.12).toFixed(2) + ')';
    x.lineWidth = 0.8 + rnd() * 1.2;
    const px = rnd() * 128, py = rnd() * 128, len = 4 + rnd() * 9, a = -0.35 + rnd() * 0.7;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke();
  }
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; return t;
}

// ---------------------------------------------------------------- loft helper
// Sections: { z, w, h, y } ellipse half-width w, half-height h, centered at y.
// Returns a watertight flat-shaded tube with vertex colors darkening the back
// (top) and lightening the belly, the same technique as the rowboat hull.
function loft(secs, n, colTop, colBelly, mat) {
  const pos = [], col = [], uv = [];
  const cT = new T.Color(colTop), cB = new T.Color(colBelly), cc = new T.Color();
  const ring = s => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push([Math.sin(a) * s.w, s.y + Math.cos(a) * s.h, s.z]);
    }
    return pts;
  };
  const rings = secs.map(ring);
  const push = (p, vfrac, u, v) => {
    pos.push(p[0], p[1], p[2]);
    cc.copy(cB).lerp(cT, vfrac); col.push(cc.r, cc.g, cc.b);
    uv.push(u, v);
  };
  for (let r = 0; r < rings.length - 1; r++) {
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a = rings[r][i], b = rings[r][j], c = rings[r + 1][i], d = rings[r + 1][j];
      // vfrac from ring angle: i=0 is top (cos=1)
      const vf = k => 0.5 + 0.5 * Math.cos((k / n) * Math.PI * 2);
      push(a, vf(i), r / secs.length, i / n); push(c, vf(i), (r + 1) / secs.length, i / n); push(b, vf(j), r / secs.length, j / n);
      push(b, vf(j), r / secs.length, j / n); push(c, vf(i), (r + 1) / secs.length, i / n); push(d, vf(j), (r + 1) / secs.length, j / n);
    }
  }
  // cap both ends with fans
  for (const [ri, dir] of [[0, -1], [rings.length - 1, 1]]) {
    const s = secs[ri], ctr = [0, s.y, s.z];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, a = rings[ri][i], b = rings[ri][j];
      const vf = k => 0.5 + 0.5 * Math.cos((k / n) * Math.PI * 2);
      if (dir < 0) { push(ctr, 0.5, 0, 0.5); push(a, vf(i), 0, i / n); push(b, vf(j), 0, j / n); }
      else { push(ctr, 0.5, 1, 0.5); push(b, vf(j), 1, j / n); push(a, vf(i), 1, i / n); }
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  const m = new T.Mesh(g, mat); m.castShadow = true; return m;
}

// ---------------------------------------------------------------- the wolf
function buildWolf() {
  const fur = furTexture('#ddd8cb', '60,56,48');
  const matBody = new T.MeshStandardMaterial({ vertexColors: true, map: fur, roughness: 0.95, flatShading: true });
  const matDark = new T.MeshStandardMaterial({ color: 0x4a463e, roughness: 0.95, flatShading: true });
  const matPale = new T.MeshStandardMaterial({ color: 0xb9b4a6, roughness: 0.95, flatShading: true });
  const matFur = new T.MeshStandardMaterial({ color: 0x968f80, map: fur, roughness: 0.95, flatShading: true });

  const root = new T.Group();
  const body = new T.Group(); body.position.y = 0.68; root.add(body);

  // torso: nose->tail along +z? build tail(-z) to chest(+z)
  const TOP = 0x817c6f, BELLY = 0xd6cfbd;
  const torso = loft([
    { z: -0.58, w: 0.125, h: 0.165, y: 0.05 },   // hips
    { z: -0.28, w: 0.15, h: 0.20, y: 0.05 },     // loin, belly tucked up
    { z: 0.08, w: 0.165, h: 0.25, y: 0.02 },     // ribcage
    { z: 0.34, w: 0.17, h: 0.285, y: 0.0 },      // chest, deepest point
    { z: 0.5, w: 0.15, h: 0.26, y: 0.05 },       // shoulder hump, tallest
    { z: 0.58, w: 0.12, h: 0.2, y: 0.07 }        // into the neck
  ], 10, TOP, BELLY, matBody);
  body.add(torso);

  // neck: separate loft so the head can carry it
  const neckG = new T.Group(); neckG.position.set(0, 0.14, 0.56); neckG.rotation.x = -0.35; body.add(neckG);
  const neck = loft([
    { z: 0, w: 0.13, h: 0.175, y: 0 },
    { z: 0.16, w: 0.115, h: 0.15, y: 0.05 },
    { z: 0.3, w: 0.10, h: 0.125, y: 0.10 }
  ], 8, TOP, BELLY, matBody);
  neckG.add(neck);

  // head
  const head = new T.Group(); head.position.set(0, 0.10, 0.30); head.rotation.x = 0.32; neckG.add(head);
  const skull = loft([
    { z: -0.07, w: 0.12, h: 0.12, y: 0 },
    { z: 0.08, w: 0.11, h: 0.105, y: 0.005 },
    { z: 0.17, w: 0.062, h: 0.058, y: -0.025 },  // stop -> muzzle
    { z: 0.34, w: 0.045, h: 0.04, y: -0.05 }     // nose
  ], 8, TOP, BELLY, matBody);
  head.add(skull);
  const nose = new T.Mesh(new T.BoxGeometry(0.055, 0.04, 0.045), matDark);
  nose.position.set(0, -0.04, 0.345); head.add(nose);
  // jaw
  const jaw = new T.Group(); jaw.position.set(0, -0.06, 0.11); head.add(jaw);
  const jawM = loft([
    { z: -0.02, w: 0.052, h: 0.03, y: 0 },
    { z: 0.2, w: 0.032, h: 0.02, y: -0.002 }
  ], 6, 0x817c6f, 0xa89f8d, matBody);
  jaw.add(jawM);
  // teeth hint
  const teeth = new T.Mesh(new T.BoxGeometry(0.06, 0.015, 0.1), matPale);
  teeth.position.set(0, 0.012, 0.1); teeth.scale.set(0.8, 0.6, 0.8); jaw.add(teeth);
  // ears
  const ears = [];
  for (const sd of [-1, 1]) {
    const e = new T.Group(); e.position.set(sd * 0.07, 0.115, -0.045);
    const cone = new T.Mesh(new T.ConeGeometry(0.045, 0.13, 4), matFur);
    cone.rotation.y = Math.PI / 4; cone.position.y = 0.05; cone.castShadow = true;
    const inner = new T.Mesh(new T.ConeGeometry(0.025, 0.08, 4), matDark);
    inner.rotation.y = Math.PI / 4; inner.position.set(0, 0.035, 0.012);
    e.add(cone); e.add(inner); e.rotation.z = sd * -0.18; head.add(e); ears.push(e);
  }
  // eyes: amber, catch light
  for (const sd of [-1, 1]) {
    const eye = new T.Mesh(new T.SphereGeometry(0.021, 8, 6),
      new T.MeshStandardMaterial({ color: 0xd8a03c, emissive: 0x6b4a10, roughness: 0.3 }));
    eye.position.set(sd * 0.068, 0.028, 0.13); head.add(eye);
  }

  // tail: 3 chained segments
  const tailRoot = new T.Group(); tailRoot.position.set(0, 0.1, -0.56); body.add(tailRoot);
  let tp = tailRoot; const tailSegs = [tailRoot];
  for (let i = 0; i < 2; i++) {
    const seg = loft([
      { z: 0, w: 0.055 - i * 0.012, h: 0.06 - i * 0.012, y: 0 },
      { z: -0.2, w: 0.045 - i * 0.014, h: 0.05 - i * 0.014, y: 0 }
    ], 6, TOP, BELLY, matBody);
    tp.add(seg);
    const nxt = new T.Group(); nxt.position.z = -0.175; tp.add(nxt); tp = nxt; tailSegs.push(nxt);
  }
  const tuft = new T.Mesh(new T.ConeGeometry(0.05, 0.16, 6), matDark);
  tuft.rotation.x = Math.PI / 2 + 0.15; tuft.position.z = -0.07; tuft.castShadow = true; tp.add(tuft);

  // legs: two-segment, pivoted at shoulder/hip and knee/hock
  function leg(x, z, front) {
    const hip = new T.Group(); hip.position.set(x, -0.02, z); body.add(hip);
    const upper = loft([
      { z: 0, w: 0.07, h: 0.09, y: 0 },
      { z: -0.32, w: 0.042, h: 0.05, y: 0 }
    ], 6, TOP, BELLY, matBody);
    upper.rotation.x = -Math.PI / 2; hip.add(upper);
    const knee = new T.Group(); knee.position.y = -0.32; hip.add(knee);
    const lower = loft([
      { z: 0, w: 0.04, h: 0.048, y: 0 },
      { z: -0.3, w: 0.028, h: 0.033, y: 0 }
    ], 6, 0x6e695e, 0x9a9385, matBody);
    lower.rotation.x = -Math.PI / 2; knee.add(lower);
    const paw = new T.Mesh(new T.BoxGeometry(0.075, 0.045, 0.11), matDark);
    paw.position.set(0, -0.315, 0.02); paw.castShadow = true; knee.add(paw);
    return { hip, knee, front };
  }
  const legs = [
    leg(-0.13, 0.42, true), leg(0.13, 0.42, true),
    leg(-0.115, -0.42, false), leg(0.115, -0.42, false)
  ];

  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { g: root, body, neckG, head, jaw, ears, tailSegs, legs };
}

// ---------------------------------------------------------------- animation
// One parametric pose function drives every state from a shared clock.
function poseWolf(w, state, t) {
  const L = w.legs;
  const set = (o, x) => { o.rotation.x = x; };
  w.body.position.y = 0.62; w.body.rotation.x = 0; w.body.rotation.z = 0;
  w.g.rotation.z = 0; w.g.position.y = 0;
  w.neckG.rotation.x = -0.6; w.head.rotation.x = 0.5; w.jaw.rotation.x = 0;
  if (state === 'idle') {
    w.body.position.y = 0.62 + Math.sin(t * 1.6) * 0.008;
    w.body.rotation.x = Math.sin(t * 1.6) * 0.006;
    L.forEach(l => { set(l.hip, 0); set(l.knee, 0.05); });
    w.neckG.rotation.x = -0.62 + Math.sin(t * 0.9) * 0.03;
    w.head.rotation.y = Math.sin(t * 0.5) * 0.25;
    w.ears.forEach((e, i) => { e.rotation.x = Math.sin(t * 3.1 + i * 2.6) > 0.965 ? -0.35 : 0; });
    w.tailSegs.forEach((s, i) => { s.rotation.y = Math.sin(t * 1.7 + i * 0.7) * 0.14; s.rotation.x = i === 0 ? -0.55 : 0.22; });
  } else if (state === 'walk' || state === 'run') {
    const run = state === 'run';
    const sp = run ? 9.5 : 5.0, amp = run ? 0.85 : 0.5;
    const ph = t * sp;
    // diagonal gait for walk, gallop pairing for run
    const off = run ? [0, 0.35, Math.PI, Math.PI + 0.35] : [0, Math.PI, Math.PI, 0];
    L.forEach((l, i) => {
      const p = ph + off[i];
      set(l.hip, Math.sin(p) * amp * (l.front ? 1 : 0.9));
      set(l.knee, Math.max(0, Math.cos(p)) * amp * 0.9 + 0.08);
    });
    w.body.position.y = 0.62 + Math.abs(Math.sin(ph * (run ? 1 : 2))) * (run ? 0.07 : 0.02);
    w.body.rotation.x = run ? Math.sin(ph) * 0.10 : 0;
    w.neckG.rotation.x = (run ? -0.25 : -0.5) + Math.sin(ph * (run ? 1 : 2)) * 0.03;
    w.head.rotation.x = run ? 0.2 : 0.42;
    w.tailSegs.forEach((s, i) => { s.rotation.x = i === 0 ? (run ? 0.15 : -0.35) : 0.18; s.rotation.y = Math.sin(t * 3 + i) * 0.1; });
    w.ears.forEach(e => { e.rotation.x = run ? -0.5 : -0.1; });
  } else if (state === 'attack') {
    const p = Math.min(1, (t % 1.2) / 0.45), snap = Math.sin(Math.min(1, p) * Math.PI);
    w.body.rotation.x = -0.28 * snap;
    w.body.position.y = 0.62 + 0.16 * snap;
    w.neckG.rotation.x = -0.6 + 0.45 * snap;
    w.head.rotation.x = 0.5 - 0.25 * snap;
    w.jaw.rotation.x = 0.62 * snap;
    L.forEach((l, i) => { set(l.hip, (l.front ? -0.9 : 0.7) * snap); set(l.knee, (l.front ? 0.5 : 0.3) * snap + 0.05); });
    w.ears.forEach(e => { e.rotation.x = -0.6; });
    w.tailSegs.forEach((s, i) => { s.rotation.x = i === 0 ? -0.1 : 0.1; });
  }
}

// ---------------------------------------------------------------- shots
const wolf = buildWolf(); scene.add(wolf.g);
const VIEWS = {
  three4: { pos: [2.6, 1.5, 3.1], look: [0, 0.55, 0] },
  side: { pos: [3.6, 0.9, 0.15], look: [0, 0.55, 0] },
  front: { pos: [0.4, 1.0, 3.6], look: [0, 0.6, 0] },
  low: { pos: [2.2, 0.55, 2.4], look: [0, 0.6, 0] }
};
window.__shot = (state, t, view, yaw) => {
  poseWolf(wolf, state, t);
  wolf.g.rotation.y = yaw || 0;
  const v = VIEWS[view];
  cam.position.set(...v.pos); cam.lookAt(...v.look);
  renderer.render(scene, cam);
  return true;
};
window.__ready = true;
// live demo loop: cycles states on a slow turntable
const STATES = ['idle', 'walk', 'run', 'attack'];
let t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  const st = STATES[Math.floor(t / 5) % STATES.length];
  poseWolf(wolf, st, t);
  wolf.g.rotation.y = t * 0.35;
  cam.position.set(2.6, 1.5, 3.1); cam.lookAt(0, 0.55, 0);
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
})();
</script>
</body>
