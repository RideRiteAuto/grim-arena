<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Model lab: TREE</title>
<style>
  body { margin:0; background:#12140f; }
  #lbl { position:fixed; left:12px; top:12px; font:600 13px system-ui,sans-serif; color:#F3DC00; letter-spacing:.08em; }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<div id="lbl">TREE</div>
<script type="module">
// Prop lab template. Copy to model-lab/<thing>.html, replace TREE throughout,
// and adjust the cameras to suit the object's size.
//
// A prop is not a rig, so this page is not a state turntable. What it has to
// answer instead is: does it read as the thing, from the distances and angles a
// player actually sees it from, in the light the game is actually lit in. So
// the shot hook takes a named CAMERA rather than a named state, and the
// lighting flips between the game's dusk, flat noon and night, because a thing
// that only looks good in the dark looks wrong all day.
//
// Two pieces here are load-bearing and should survive any edit:
//   - the render loop is CANCELLED on the first __shot call. Without that the
//     loop draws over the harness's camera and every named view comes back
//     looking like the same 3/4 angle, plausibly enough that you do not notice.
//   - the 1.8 m human on the `scale` camera. Nothing else calibrates size.
import * as T from 'three';
import { makeTreeKit } from './tree.js';

const W = 960, H = 660;
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
const cam = new T.PerspectiveCamera(42, W / H, 0.05, 200);

// Two lighting rigs. DUSK is the game's own look; DAY is the honest test,
// because additive fire has nothing to hide behind in flat light.
const LIGHTS = {
  dusk: { sky: 0x141a17, hemi: [0x3d4a58, 0x241f16, 0.55], sun: [0xffb779, 0.55, [6, 9, 4]], ground: 0x33402b, fog: [16, 62] },
  day:  { sky: 0x8fa9b8, hemi: [0xcdd9e8, 0x3a3628, 0.95], sun: [0xffeecc, 1.7, [6, 10, 4]], ground: 0x53603c, fog: [30, 120] },
  night:{ sky: 0x070a0d, hemi: [0x1b2430, 0x0b0d0a, 0.30], sun: [0x9fb6d8, 0.18, [-5, 8, -3]], ground: 0x1e2418, fog: [10, 46] }
};
let hemi, sun, ground;
function applyLights(name) {
  const L = LIGHTS[name] || LIGHTS.dusk;
  scene.background = new T.Color(L.sky);
  scene.fog = new T.Fog(L.sky, L.fog[0], L.fog[1]);
  hemi.color.setHex(L.hemi[0]); hemi.groundColor.setHex(L.hemi[1]); hemi.intensity = L.hemi[2];
  sun.color.setHex(L.sun[0]); sun.intensity = L.sun[1]; sun.position.set(...L.sun[2]);
  ground.material.color.setHex(L.ground);
  window.__light = name;
}

hemi = new T.HemisphereLight(0xffffff, 0x000000, 1); scene.add(hemi);
sun = new T.DirectionalLight(0xffffff, 1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0012;
scene.add(sun);

// A dirt disc with a little relief, so the ground glow has something to drape
// over and the fire is not sitting on a mirror.
const gGeo = new T.PlaneGeometry(60, 60, 60, 60);
gGeo.rotateX(-Math.PI / 2);
const heightAt = (x, z) => Math.sin(x * 0.28) * 0.055 + Math.sin(z * 0.21 + 1.1) * 0.045
  + Math.sin((x + z) * 0.62) * 0.018;
{
  const p = gGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  gGeo.computeVertexNormals();
}
ground = new T.Mesh(gGeo, new T.MeshStandardMaterial({ color: 0x53603c, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// A 1.8 m human stand-in. Nothing calibrates a prop's size like putting a
// person next to it, and a campfire that is right for a torch is far too small
// for something people sit around.
const manM = new T.MeshStandardMaterial({ color: 0x3b4250, roughness: 0.9, flatShading: true });
const man = new T.Group();
{
  const legs = new T.Mesh(new T.CylinderGeometry(0.14, 0.17, 0.9, 8), manM); legs.position.y = 0.45;
  const torso = new T.Mesh(new T.CylinderGeometry(0.20, 0.24, 0.62, 8), manM); torso.position.y = 1.16;
  const head = new T.Mesh(new T.SphereGeometry(0.13, 10, 8), manM); head.position.y = 1.62;
  [legs, torso, head].forEach(m => { m.castShadow = true; man.add(m); });
  man.position.set(2.2, heightAt(2.2, 2.2), 2.2);
  man.visible = false;
  scene.add(man);
}

const kit = makeTreeKit(T);
let prop = kit.build({ kind: 'tree', seed: 11, x: 0, y: heightAt(0, 0), z: 0 });
scene.add(prop.g);
let PKIND = 'tree';
const rebuild = (kind, seed) => {
  scene.remove(prop.g);
  prop = kit.build({ kind, seed: seed || (kind === 'oak' ? 23 : 11), x: 0, y: heightAt(0, 0), z: 0 });
  scene.add(prop.g);
  PKIND = kind;
  window.__prop = prop;
};
window.__rebuild = rebuild;
// fell progress 0..1: rotates the fell group about its hinge like the game fx
const setFell = (u) => {
  prop.fell.rotation.z = u * 1.58;
  prop.stump.visible = u > 0.02;
};
window.__setFell = setFell;
window.__prop = prop;
window.__kit = kit;
window.__scene = scene;

// Named cameras. Standing, seated, close, far and straight down: the five ways
// a player will ever look at a thing on the ground.
const VIEWS = {
  stand:   { pos: [7.5, 3.4, 9.5], look: [0, 3.2, 0] },
  player:  { pos: [3.4, 1.6, 5.2], look: [0, 2.6, 0] },
  trunk:   { pos: [2.2, 1.2, 3.0], look: [0, 1.0, 0] },
  flare:   { pos: [1.8, 0.7, 2.3], look: [0, 0.45, 0] },
  crown:   { pos: [6.0, 7.5, 6.0], look: [0, 4.6, 0] },
  fallen:  { pos: [5.5, 2.6, 7.5], look: [2.2, 0.8, 0] },
  breakline:{ pos: [2.4, 1.1, 2.2], look: [0.3, 0.65, 0] },
  far:     { pos: [14, 5.5, 16], look: [0, 3.2, 0] },
  scale:   { pos: [5.2, 2.0, 6.4], look: [0.6, 2.2, 0.2] }
};

// The turntable keeps rendering after a shot is taken, so the screenshot ends
// up showing whatever the loop drew next rather than the camera that was
// asked for. Every named view came back looking like the same 3/4. The first
// __shot call kills the loop for good: from then on the page only ever draws
// what the harness asked it to draw.
let RAF = 0;
window.__shot = (view, t, light, opts) => {
  opts = opts || {};
  if (RAF) { cancelAnimationFrame(RAF); RAF = 0; }
  if (light) applyLights(light);
  man.visible = !!opts.man;
  if (opts.kind && opts.kind !== PKIND) rebuild(opts.kind, opts.seed);
  else if (opts.seed) rebuild(PKIND, opts.seed);
  setFell(opts.fell || 0);
  kit.tick(t === undefined ? 3.0 : t);
  const v = VIEWS[view] || VIEWS.stand;
  cam.position.set(...v.pos);
  cam.lookAt(...v.look);
  renderer.render(scene, cam);
  return true;
};
window.__views = Object.keys(VIEWS);
window.__stats = () => {
  let meshes = 0, tris = 0;
  prop.g.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    const p = o.geometry.attributes.position;
    tris += (o.geometry.index ? o.geometry.index.count : p.count) / 3;
  });
  renderer.render(scene, cam);
  return { meshes, tris, calls: renderer.info.render.calls, radius: prop.radius };
};
window.__ready = true;

applyLights('dusk');
const lbl = document.getElementById('lbl');
const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  kit.tick(t);
  const a = t * 0.28;
  cam.position.set(Math.sin(a) * 9.5, 4.2, Math.cos(a) * 9.5);
  cam.lookAt(0, 3.0, 0);
  lbl.textContent = 'TREE  ' + (window.__light || 'dusk').toUpperCase();
  renderer.render(scene, cam);
  RAF = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
